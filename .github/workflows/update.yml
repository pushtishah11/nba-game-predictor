name: Daily predictions

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC = 9-10am ET, before the earliest tip-offs
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-predictions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download latest scores and schedule
        run: python src/scrape.py

      - name: Download new box scores
        run: python src/boxscores.py

      - name: Download betting lines for finished games
        run: python src/odds.py

      - name: Predict upcoming games
        run: python src/export.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update predictions for $(date -u +%Y-%m-%d)"
            git push
          fi
